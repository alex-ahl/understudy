# Every service runs the understudy CLI from the repo root, with private/ mounted
# in place and downloaded models kept in the `cache` volume. Images are built per
# job (see the Dockerfile), so a machine builds only the ones it runs.
#
#   docker compose --profile tools build cpu   build an image: any service below
#   docker compose run --rm cpu dataset        dataset, stats, any other CPU command
#   docker compose run --rm gpu train          training, on an NVIDIA GPU
#   docker compose run --rm convert            adapter -> GGUF
#   docker compose up -d serve bot             model server and bots, on a GPU
#   docker compose up -d serve-cpu bot         the same without one

x-app: &app
  volumes:
    - ./private:/work/private
    - cache:/cache

x-nvidia: &nvidia
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-llm: &llm
  command: serve
  ports:
    - 127.0.0.1:8080:8080
  networks:
    default:
      aliases: [llm]
  restart: unless-stopped

services:
  cpu:
    <<: *app
    image: understudy:cpu
    build: {context: ., target: cpu}
    profiles: [tools]

  gpu:
    <<: [*app, *nvidia]
    image: understudy:train
    build: {context: ., target: train}
    profiles: [tools]

  convert:
    <<: *app
    image: understudy:convert
    build: {context: ., target: convert}
    command: convert
    profiles: [tools]

  serve:
    <<: [*app, *nvidia, *llm]
    image: understudy:serve-cuda
    build: {context: ., target: serve-cuda}
    profiles: [gpu, tools]

  serve-cpu:
    <<: [*app, *llm]
    image: understudy:serve
    build: {context: ., target: serve}
    profiles: [cpu, tools]

  bot:
    <<: *app
    image: understudy:cpu
    build: {context: ., target: cpu}
    command: bot
    environment:
      LLM_URL: http://llm:8080
    restart: unless-stopped

volumes:
  cache:
