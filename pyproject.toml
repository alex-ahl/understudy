[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "understudy"
version = "0.1.0"
description = "Discord persona bots: fine-tune one LoRA adapter on a server's history and post as each persona"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dataset = ["presidio-analyzer", "presidio-anonymizer", "gliner"]
# torch is installed separately, from the index matching the CUDA version
train = ["unsloth", "trl", "peft", "transformers", "datasets", "bitsandbytes"]
bot = ["discord.py"]

[project.scripts]
understudy = "understudy.cli:main"

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
